name: OmniDoc CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgresql:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: omnidoc_user
          POSTGRES_PASSWORD: OmniDoc2025Secure
          POSTGRES_DB: omnidoc_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.2-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1 tesseract-ocr

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 services/ --count --select=E9,F63,F7,F82 \
            --show-source --statistics
          flake8 services/ --count --exit-zero \
            --max-line-length=120 --statistics

      - name: Create test .env
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=omnidoc_user
          POSTGRES_PASSWORD=OmniDoc2025Secure
          POSTGRES_DB=omnidoc_db
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          MONGO_ROOT_USER=omnidoc_mongo
          MONGO_ROOT_PASSWORD=OmniDoc2025Secure
          MONGO_HOST=localhost
          MONGO_PORT=27017
          MONGO_DB=omnidoc_quarantine
          REDIS_PASSWORD=
          REDIS_HOST=localhost
          REDIS_PORT=6379
          MINIO_ROOT_USER=omnidoc_minio
          MINIO_ROOT_PASSWORD=MinIO2025OK
          MINIO_HOST=localhost
          MINIO_PORT=9000
          MINIO_CONSOLE_PORT=9001
          MINIO_BUCKET_DOCUMENTS=documents
          API_HOST=0.0.0.0
          API_PORT=8000
          SECRET_KEY=ci_test_secret_key_32_chars_long_x
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          ANTHROPIC_API_KEY=
          NOTIFICATIONS_ENABLED=false
          SMTP_HOST=smtp.gmail.com
          SMTP_PORT=587
          SMTP_USER=
          SMTP_PASSWORD=
          SMTP_FROM=noreply@omnidoc.ai
          SLACK_WEBHOOK_URL=
          MLFLOW_TRACKING_URI=sqlite:///mlruns.db
          MLFLOW_EXPERIMENT_NAME=omnidoc_embeddings
          EOF

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short
        env:
          PYTHONPATH: .